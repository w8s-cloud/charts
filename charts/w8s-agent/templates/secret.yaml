{{- if not .Values.joinToken.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "w8s-agent.joinSecretName" . }}
type: Opaque
stringData:
  {{ .Values.joinToken.secretKey }}: {{ required "joinToken.value or joinToken.existingSecret is required" .Values.joinToken.value | quote }}
{{- end }}
