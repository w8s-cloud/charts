{{- if eq (include "w8s-agent.clusterWide" .) "true" }}
{{- /*
The import DNS (W3T-199, crates/w8s-agent/src/import_dns.rs): the agent
answers `<svc>.<ns>.svc.cluster.<remote>` for every Service imported from
the organisation's other clusters, and cluster_dns.rs points the cluster's
CoreDNS or kube-dns at this Service for exactly those zones. Port 53 here,
5353 in the pod so the agent needs no capability to bind it.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "w8s-agent.dnsServiceName" . }}
  labels:
    app.kubernetes.io/name: {{ include "w8s-agent.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "w8s-agent.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
{{- end }}
