{{- if eq (include "w8s-agent.clusterWide" .) "true" }}
# This cluster's Cloudflare tunnel: one object, applied by the hub and
# reconciled by the agent into the cloudflared Deployment it owns
# (crates/w8s-agent/src/cloudflared.rs). In the w8s.cloud group since chart
# 0.25.0; before, cloudflaretunnels.w8s.dev (crds/, which Helm never
# upgrades or removes, so it stays on older clusters: the agent moves its
# object over and deletes it). A template rather than crds/ so
# `helm upgrade` installs it on clusters that predate it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudflaretunnels.w8s.cloud
  annotations:
    # Deleting the CRD deletes the tunnel object, and with it (its owner)
    # the cloudflared Deployment: keep it on chart uninstall.
    helm.sh/resource-policy: keep
spec:
  group: w8s.cloud
  names:
    kind: CloudflareTunnel
    listKind: CloudflareTunnelList
    plural: cloudflaretunnels
    singular: cloudflaretunnel
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - tunnelId
                - tokenSecretName
                - cloudflaredImage
                - orgId
                - clusterId
              properties:
                tunnelId:
                  type: string
                tokenSecretName:
                  type: string
                cloudflaredImage:
                  type: string
                orgId:
                  type: string
                clusterId:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                  nullable: true
      subresources:
        status: {}
{{- end }}
