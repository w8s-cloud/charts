{{- if not .Values.certificates.existingSecret }}
# The trust anchors the agent verifies the relay's TLS certificate against
# (see values.yaml's certificates.caBundle - ISRG Root X1 by default, the
# public Let's Encrypt root behind relay.w8s.cloud). Rendered so a plain
# `helm install` works with no out-of-band Secret; set
# certificates.existingSecret to bring your own instead (W3T-32).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "w8s-agent.caSecretName" . }}
type: Opaque
stringData:
  {{ .Values.certificates.caKey }}: |
{{ required "certificates.caBundle is required when certificates.existingSecret is empty" .Values.certificates.caBundle | indent 4 }}
{{- end }}
