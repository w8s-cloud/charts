# Upgrading by hand: `helm upgrade w8s-agent w8s/w8s-agent --namespace
# w8s-system --reset-then-reuse-values` (Helm 3.14+). Not `--reuse-values`:
# that replays the previous release's computed values and never sees a
# block a newer chart added (observability in 0.6.0, selfUpgrade in
# 0.7.0), so the render fails with "nil pointer evaluating
# interface {}.enabled". --reset-then-reuse-values takes this file's
# defaults first and re-applies every --set you gave on top.
replicaCount: 1

image:
  # The public OCI registry (docs/public-registry.md), a second, separate
  # registry from registry.w8s.cloud - that one is the hub's own CI
  # registry, holds every build of everything, and stays authenticated.
  # This one holds only released public artifacts (this image, w8s-relay
  # below, and the chart itself) and needs no credential at all: anonymous
  # read is the registry's own property, not a route-level exception on
  # some other registry. Not ghcr: nothing has pushed there since builds
  # moved into the cluster, and those tags are frozen. Named
  # `<git repository>/<image>` here as in the CI registry; releases up to
  # 0.46.0 published `oci.w8s.cloud/w8s-agent`, which stays where it is.
  repository: oci.w8s.cloud/w8s/w8s-agent
  # The chart's own version, not `latest`: a released chart version always
  # runs the image it was released with, and bumping the chart is what
  # moves this forward - keep this in step with Chart.yaml's version by
  # hand (ops/release-public publishes the image under this same tag,
  # from the hub's CI registry where ops/deploy-hub/hub-images tagged it).
  tag: "0.46.4"
  # The image's content digest (sha256:...). Empty in the source chart;
  # the published chart has it filled in for every chart version when the
  # chart is packaged (k8s/pin-images.sh), so a chart version
  # always runs the exact agent binary it was released with, and nothing
  # that moves a tag in the registry changes what a cluster runs. To run
  # something else, set digest (and tag) yourself, or set digest to "" to
  # follow the tag.
  digest: "" # pin: image
  # Empty picks for you: IfNotPresent when pinned by digest, Always for the
  # moving `latest` tag (a chart upgrade that adds a flag the binary must
  # know otherwise restarts the pod on whatever image the node cached, and
  # it crash-loops on the new argument - GKE, 2026-09-20), IfNotPresent
  # for any other tag.
  pullPolicy: ""

nameOverride: ""
fullnameOverride: ""

# The agent's log filter (RUST_LOG). info records each command the hub
# sends and how it ended, never a request or response body. debug is for a
# troubleshooting session, not a default: it is also the level the HTTP and
# Kubernetes client libraries log their own request details at.
rustLog: info

joinToken:
  existingSecret: ""
  secretKey: W8S_JOIN_TOKEN
  value: ""

