apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cr.name" . }}-files
  labels:
    {{- include "cr.labels" . | nindent 4 }}
data:
  # Read after the image's own settings (local.d). The uuid is fixed per
  # site so a restarted pod keeps its replication checkpoints instead of
  # starting every pull over.
  10-w8s.ini: |
    [couchdb]
    single_node = true
    uuid = {{ printf "%s/%s/%s" .Values.clusterId .Release.Namespace .Release.Name | sha256sum | trunc 32 }}

    [chttpd]
    bind_address = any

  wire-replication.sh: |
    {{- .Files.Get "files/wire-replication.sh" | nindent 4 }}
  nginx.conf.template: |
    {{- .Files.Get "files/nginx.conf.template" | nindent 4 }}
  40-w8s-guestbook.sh: |
    {{- .Files.Get "files/40-w8s-guestbook.sh" | nindent 4 }}
  index.html: |
    {{- .Files.Get "files/index.html" | nindent 4 }}
