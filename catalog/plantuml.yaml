name: PlantUML Server
tagline: Renders UML and other diagrams from text, over HTTP.
description: |
  Post the text of a diagram and get back an SVG or PNG. Wikis, code review
  tools and documentation builds use it to keep diagrams in version control
  as text rather than as binaries nobody can edit. Stateless: nothing to
  persist and nothing to back up.
