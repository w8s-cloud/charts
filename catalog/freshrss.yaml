name: FreshRSS
tagline: A feed reader for the web you choose to follow.
description: |
  FreshRSS pulls the feeds you subscribe to, keeps what you have read and
  serves it to a browser or to any client speaking the Google Reader or
  Fever API. Its database and cache are on volumes the chart creates
  (SQLite by default).
