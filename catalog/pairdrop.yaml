name: PairDrop
tagline: Send files between devices in the browser, peer to peer.
description: |
  An AirDrop for any device with a browser: open the page on both ends
  and drop the file. Transfers go device to device over WebRTC; the
  server only introduces them, and keeps nothing. Community-maintained
  chart.
