name: Dragonfly
tagline: A multi-threaded in-memory store that speaks the Redis and Memcached protocols.
description: |
  Dragonfly uses every core of the node for one keyspace, so one
  instance can stand in for several Redis processes. Works with Redis
  and Memcached clients. Snapshots go to a persistent volume.
tags: [Key/value, Cache, Redis-compatible]
category: db
