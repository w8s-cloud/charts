artifacthub: victoriametrics/victoria-metrics-single
name: VictoriaMetrics
tagline: A single-node, Prometheus-compatible time-series database that stays small.
description: |
  Takes Prometheus remote-write, OpenTelemetry and more, and answers
  PromQL (plus its MetricsQL superset), so Grafana and alerting work
  unchanged. One binary and one volume, and typically less memory than
  Prometheus for the same series.
tags: [Metrics, Prometheus-compatible, Time series]
