artifacthub: pmint93/metabase
name: Metabase
tagline: Questions, charts and dashboards over your databases, without writing SQL.
description: |
  Point it at Postgres, MySQL, ClickHouse or a dozen other databases and
  ask questions with a point-and-click builder, or SQL when you want it.
  This starts on Metabase's own embedded database on a 5 GiB volume -
  fine to start with; for production, point `database` at a PostgreSQL.
  Community-maintained chart.
