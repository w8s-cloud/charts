artifacthub: gabe565/scanservjs
name: scanservjs
tagline: Shares a USB scanner over the network, through a browser.
description: |
  A scanner plugged into one machine at a site becomes something anybody
  there can use from a browser: preview, scan, crop, and save as PDF or
  image. Its settings live on a 1 GiB volume. The scanner itself has to be
  reachable from the node this runs on.
tags: [Scanning, SANE, Documents]
