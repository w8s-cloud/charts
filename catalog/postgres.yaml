artifacthub: groundhog2k/postgres
name: PostgreSQL
tagline: One PostgreSQL server, with its data on a volume.
description: |
  The relational database most things expect. One server, its data on a
  10 GiB volume, nothing clustered and no operator. Other clusters in the
  organisation can reach it by name once you export its Service - which is
  how an app on one site talks to a database on another.
tags: [SQL, Relational, Postgres]
category: db
