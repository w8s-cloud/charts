chart:
  url: https://github.com/groundhog2k/helm-charts/releases/download/postgres-1.6.8/postgres-1.6.8.tgz
  version: 1.6.8
source: https://www.postgresql.org
logo: https://raw.githubusercontent.com/docker-library/docs/master/postgres/logo.png
values: {storage: {requestedSize: 10Gi}}
