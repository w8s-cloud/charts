artifacthub: twin/gatus
name: Gatus
tagline: Health checks and a status page, declared in one YAML file.
description: |
  Gatus probes your endpoints on an interval, checks the answer against
  conditions you write (status, body, latency, certificate expiry) and
  shows the result on a status page. Configuration as code, no database
  needed.
tags: [Uptime, Status page, Health checks]
category: observability
