artifacthub: gabe565/memos
name: Memos
tagline: A quick note-taking server, one plain-text note at a time.
description: |
  Memos is for the notes you would otherwise lose in a chat window: write,
  tag, search, and share one if you want to. Light enough to sit on every
  site's cluster. Notes live on a 2 GiB volume (SQLite).
tags: [Notes, Markdown, Self-hosted]
category: web
