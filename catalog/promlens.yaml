artifacthub: christianhuth/promlens
name: PromLens
tagline: Builds and explains PromQL queries, against any Prometheus API.
description: |
  PromLens takes a PromQL query apart and shows what each piece selects and
  how much it costs, which is how you learn the language rather than
  guessing at it. Point it at the metrics store you already run - the
  VictoriaMetrics entry in this catalog serves the same API. Stateless.
tags: [PromQL, Metrics, Queries]
category: observability
