artifacthub: gabe565/plex
name: Plex Media Server
tagline: Serves a library of video and music to Plex's own clients.
description: |
  Plex indexes a media library and streams it to the apps on televisions,
  phones and browsers, transcoding where a client needs it. Its database and
  metadata live on a 20 GiB volume; the media itself belongs on storage you
  mount beside it. The server is free software to run, but it is not open
  source and it signs in to plex.tv.
tags: [Media, Video, Streaming]
category: web
