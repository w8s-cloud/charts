artifacthub: gabe565/headscale
name: Headscale
tagline: Your own Tailscale control server, for your own tailnet.
description: |
  Headscale is an open implementation of Tailscale's coordination server:
  the official clients connect to it instead of to Tailscale's own, and the
  tailnet is yours. Its keys and node list live on a 1 GiB volume (SQLite).
  This is for devices and laptops - w8s connects your clusters itself.
tags: [VPN, WireGuard, Tailscale]
category: security
