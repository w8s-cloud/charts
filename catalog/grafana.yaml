artifacthub: grafana/grafana
name: Grafana
tagline: Dashboards and alerts over metrics, logs and SQL databases.
description: |
  Grafana queries Prometheus, VictoriaMetrics, Loki, PostgreSQL,
  ClickHouse and many more, and puts them on one dashboard. Its own
  settings and dashboards live on a 5 GiB volume. The chart's RBAC and
  test pod are off: they are for its sidecars, which this does not use.
tags: [Dashboards, Metrics, Alerting]
category: data
